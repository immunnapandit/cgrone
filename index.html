<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#11223D" />

    <!-- Fonts were pulled in by an @import at the top of index.css, which
         chains HTML -> CSS -> Google's CSS -> font files before anything can
         paint. Loading them here runs the lookup in parallel with the app CSS
         and removes a round trip from largest-contentful-paint.

         EB Garamond + Roboto, which is henleyglobal.com's pairing — the client
         picked that one out of the four by name. Their stylesheet serves
         Classical Garamond BT from their own CDN, which is a licensed
         Bitstream face we can neither hotlink nor redistribute; EB Garamond is
         the open equivalent. Their body stack resolves to Roboto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..600&family=Roboto:wght@300;400;500;700&display=swap"
    />

    <!--seo-->
    <!-- Defaults only. server.js replaces everything between these markers
         with per-route tags, because link-preview crawlers (LinkedIn, Slack,
         WhatsApp, Facebook) never run the JavaScript that would otherwise set
         them. Keep the markers if you edit this block. -->
    <title>Cynosure Global Residency | Immigration &amp; Global Mobility</title>
    <meta
      name="description"
      content="An international advisory platform for immigration, global mobility, investment migration and cross-border expansion across India, the UK, Canada, Australia and New Zealand."
    />
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
